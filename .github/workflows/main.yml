# .github/workflows/chrome-remote-desktop-windows.yml
name: Chrome Remote Desktop (Windows RDP)

on:
  workflow_dispatch:
    inputs:
      windows_auth_command:
        description: 'ألصق أمر Windows الكامل من Google (remoting_start_host.exe --code="..." --redirect-url="..." --name=...)'
        required: true
        type: string
      pin:
        description: 'رمز PIN (6 أرقام أو أكثر) للوصول عن بُعد'
        required: true
        type: string
      hours:
        description: 'مدة التشغيل بالساعات'
        required: false
        default: '6'
        type: string

jobs:
  crd:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: معلومات الوصول
        shell: pwsh
        run: |
          Write-Host "بعد اكتمال الإعداد افتح: https://remotedesktop.google.com/access"

      - name: تثبيت Google Chrome
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $chromeInstaller = "$env:RUNNER_TEMP\chrome_installer.exe"
          Invoke-WebRequest -Uri "https://dl.google.com/chrome/install/latest/chrome_installer.exe" -OutFile $chromeInstaller
          Start-Process -FilePath $chromeInstaller -Args "/silent /install" -Wait

      - name: تثبيت Chrome Remote Desktop Host
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $crdInstaller = "$env:RUNNER_TEMP\chromeremotedesktophost.msi"
          Invoke-WebRequest -Uri "https://dl.google.com/edgedl/chrome-remote-desktop/chromeremotedesktophost.msi" -OutFile $crdInstaller
          Start-Process msiexec.exe -Wait -ArgumentList "/i `"$crdInstaller`" /qn"

      - name: تسجيل المضيف وبدء الخدمة
        shell: pwsh
        env:
          WINDOWS_AUTH_COMMAND: ${{ inputs.windows_auth_command }}
          CRD_PIN: ${{ inputs.pin }}
        run: |
          $ErrorActionPreference = "Stop"

          $cmd = $env:WINDOWS_AUTH_COMMAND
          $pin = $env:CRD_PIN

          if ([string]::IsNullOrWhiteSpace($cmd)) { throw "لم يتم إدخال أمر التفويض." }
          if ([string]::IsNullOrWhiteSpace($pin)) { throw "لم يتم إدخال رمز PIN." }

          $codeMatch = [regex]::Match($cmd, '--code="?([^"\s]+)"?')
          $redirectMatch = [regex]::Match($cmd, '--redirect-url="?([^"\s]+)"?')

          if (-not $codeMatch.Success) { throw "تعذر استخراج --code من الأمر المُدخل." }

          $code = $codeMatch.Groups[1].Value
          $redirectUrl = if ($redirectMatch.Success) { $redirectMatch.Groups[1].Value } else { "https://remotedesktop.google.com/_/oauthredirect" }
          $name = $env:COMPUTERNAME

          $hostExe = "${env:ProgramFiles(x86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"
          if (-not (Test-Path $hostExe)) {
            $hostExe = "${env:ProgramFiles}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"
          }
          if (-not (Test-Path $hostExe)) { throw "لم يتم العثور على remoting_start_host.exe" }

          & $hostExe --code="$code" --redirect-url="$redirectUrl" --name="$name" --pin="$pin"

          $service = Get-Service -Name "chromoting" -ErrorAction SilentlyContinue
          if ($service) {
            if ($service.Status -ne "Running") { Start-Service -Name "chromoting" }
            Get-Service -Name "chromoting" | Format-List *
          } else {
            Write-Host "لم يتم العثور على خدمة chromoting بالاسم المتوقع، قد تكون الخدمة بدأت باسم مختلف."
            Get-Service | Where-Object { $_.Name -like "*chrome*" -or $_.DisplayName -like "*Chrome Remote*" } | Format-Table -AutoSize
          }

      - name: إبقاء الجلسة نشطة
        shell: pwsh
        env:
          HOURS: ${{ inputs.hours }}
        run: |
          $hours = [double]::Parse($(if ($env:HOURS) { $env:HOURS } else { "6" }))
          $seconds = [int]($hours * 3600)
          Write-Host "افتح للوصول إلى الجهاز: https://remotedesktop.google.com/access"
          Write-Host "سيبقى الـ Runner نشطًا لمدة $hours ساعة/ساعات"
          Start-Sleep -Seconds $seconds
