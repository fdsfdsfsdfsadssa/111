# .github/workflows/chrome-remote-desktop.yml
name: Chrome Remote Desktop (RDP)

on:
  workflow_dispatch:
    inputs:
      windows_auth_command:
        description: 'ألصق أمر Windows الكامل من Google (remoting_start_host.exe --code="..." --redirect-url="..." --name=...)'
        required: true
        type: string
      pin:
        description: 'رمز PIN (6 أرقام أو أكثر) للوصول عن بُعد'
        required: true
        type: string
      device_name:
        description: 'اسم الجهاز (اختياري)'
        required: false
        default: 'github-actions-crd'
        type: string
      hours:
        description: 'مدة التشغيل بالساعات'
        required: false
        default: '6'
        type: string

jobs:
  crd:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: معلومات الوصول
        run: |
          echo "بعد اكتمال الإعداد افتح: https://remotedesktop.google.com/access"

      - name: تثبيت سطح مكتب XFCE والمتطلبات
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xfce4 xfce4-goodies \
            xorg dbus-x11 x11-xserver-utils \
            xserver-xorg-video-dummy \
            desktop-base \
            wget curl python3

      - name: تثبيت Google Chrome
        run: |
          wget -q -O /tmp/google-chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/google-chrome.deb

      - name: تثبيت Chrome Remote Desktop
        run: |
          wget -q -O /tmp/crd.deb https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb
          sudo apt-get install -y /tmp/crd.deb

      - name: إعداد جلسة Chrome Remote Desktop
        run: |
          echo 'exec /usr/bin/startxfce4' > "$HOME/.chrome-remote-desktop-session"
          chmod +x "$HOME/.chrome-remote-desktop-session"
          sudo usermod -aG chrome-remote-desktop "$USER" || true

      - name: استخراج بيانات التفويض وتسجيل المضيف
        env:
          WINDOWS_AUTH_COMMAND: ${{ inputs.windows_auth_command }}
          CRD_PIN: ${{ inputs.pin }}
          CRD_NAME: ${{ inputs.device_name }}
        run: |
          set -euo pipefail

          if [ -z "${WINDOWS_AUTH_COMMAND:-}" ]; then
            echo "لم يتم إدخال أمر التفويض."
            exit 1
          fi
          if [ -z "${CRD_PIN:-}" ]; then
            echo "لم يتم إدخال رمز PIN."
            exit 1
          fi

          read -r CODE REDIRECT_URL <<< "$(python3 - <<'PY'
          import os, re, shlex
          s = os.environ.get("WINDOWS_AUTH_COMMAND", "")
          code = ""
          redirect = "https://remotedesktop.google.com/_/oauthredirect"
          m = re.search(r'--code="?([^"\s]+)"?', s)
          if m: code = m.group(1)
          m = re.search(r'--redirect-url="?([^"\s]+)"?', s)
          if m: redirect = m.group(1)
          print(code, redirect)
          PY
          )"

          if [ -z "${CODE:-}" ]; then
            echo "تعذر استخراج --code من الأمر المُدخل."
            exit 1
          fi

          NAME="${CRD_NAME:-github-actions-crd}"

          sudo systemctl stop chrome-remote-desktop@"$USER" 2>/dev/null || true
          sudo systemctl stop chrome-remote-desktop 2>/dev/null || true

          # تسجيل المضيف على Linux باستخدام الكود المستخرج من أمر Windows
          DISPLAY= /opt/google/chrome-remote-desktop/start-host \
            --code="$CODE" \
            --redirect-url="$REDIRECT_URL" \
            --name="$NAME" \
            --pin="$CRD_PIN"

          sudo systemctl enable chrome-remote-desktop@"$USER" 2>/dev/null || true
          sudo systemctl start chrome-remote-desktop@"$USER" 2>/dev/null || sudo systemctl start chrome-remote-desktop 2>/dev/null || true

          sleep 10
          sudo systemctl status chrome-remote-desktop@"$USER" --no-pager 2>/dev/null || sudo systemctl status chrome-remote-desktop --no-pager 2>/dev/null || true

      - name: إبقاء الجلسة نشطة
        env:
          HOURS: ${{ inputs.hours }}
        run: |
          echo "افتح للوصول إلى الجهاز: https://remotedesktop.google.com/access"
          SECONDS_TOTAL=$(awk "BEGIN {print int(${HOURS:-6} * 3600)}")
          echo "سيبقى الـ Runner نشطًا لمدة ${HOURS:-6} ساعة/ساعات"
          sleep "$SECONDS_TOTAL"
